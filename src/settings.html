<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLM Monitor · 设置</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="settings-root">
  <div class="settings">
    <h2>账号</h2>
    <div id="account-list"></div>
    <button id="btn-add" class="primary">＋ 添加账号</button>

    <form id="account-form" hidden>
      <h3 id="form-title">添加账号</h3>
      <label>名称
        <input name="name" id="f-name" required placeholder="主账号" autocomplete="off" />
      </label>
      <label>API Key
        <input name="apiKey" id="f-key" type="password" required autocomplete="off" />
      </label>
      <label>套餐类型
        <select name="type" id="f-type">
          <option value="1">个人套餐</option>
          <option value="2">团队套餐</option>
        </select>
      </label>
      <div class="form-actions">
        <button type="button" id="btn-cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>

    <h2>通用</h2>
    <div class="row">
      <span>自动刷新间隔</span>
      <select id="interval">
        <option value="1">1 分钟</option>
        <option value="2">2 分钟</option>
        <option value="5">5 分钟</option>
        <option value="10">10 分钟</option>
        <option value="15">15 分钟</option>
        <option value="30">30 分钟</option>
        <option value="60">60 分钟</option>
      </select>
    </div>
    <div class="row">
      <span>开机自动启动</span>
      <input type="checkbox" id="startup" />
    </div>
  </div>
  <div id="toast"></div>
  <script src="settings.js"></script>
</body>
</html>
